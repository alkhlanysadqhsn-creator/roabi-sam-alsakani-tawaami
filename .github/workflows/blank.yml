name: Tawaami Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Android Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          # Prefer a project already checked into the repository.
          if find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' | grep -q .; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If the repository contains a source archive, extract it and search again.
          archive=""
          for candidate in Tawaami_Release_Candidate_SOURCE.zip Tawaami_ANDROID_PROJECT_READY_TO_UPLOAD.zip; do
            if [ -f "$candidate" ]; then archive="$candidate"; break; fi
          done
          if [ -n "$archive" ]; then
            mkdir -p _tawaami_extracted
            unzip -q "$archive" -d _tawaami_extracted
            project_file="$(find _tawaami_extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
            if [ -n "$project_file" ]; then
              echo "project_dir=$(dirname "$project_file")" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "::error::No Android Gradle project found. A source ZIP alone is not sufficient unless it contains settings.gradle(.kts), app module build files, and Android source."
          echo "Repository files:"
          find . -maxdepth 4 -type f -not -path './.git/*' | sort | head -250
          exit 1

      - name: Validate Gradle project files
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.project_dir }}"
          test -f gradlew || command -v gradle >/dev/null
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Patch known Kotlin compile blockers and print source context
        shell: bash
        run: |
          set -euo pipefail
          project_dir="${{ steps.locate.outputs.project_dir }}"
          file="$project_dir/app/src/main/java/com/tawaami/app/MainActivity.kt"
          test -f "$file"
          echo "---- MainActivity.kt context before compatibility patch ----"
          nl -ba "$file" | sed -n '65,102p;745,760p;900,914p;1140,1152p'
          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace("SmallTopAppBar", "TopAppBar")
          s = s.replace("smallTopAppBarColors", "topAppBarColors")
          # KeyboardOptions is in foundation.text, not ui.text.input.
          s = s.replace("import androidx.compose.ui.text.input.KeyboardOptions", "")
          if "import androidx.compose.foundation.text.KeyboardOptions" not in s:
              lines = s.splitlines()
              package_index = next((i for i, line in enumerate(lines) if line.startswith("package ")), -1)
              if package_index < 0:
                  raise SystemExit("Could not locate package declaration in MainActivity.kt")
              lines.insert(package_index + 1, "")
              lines.insert(package_index + 2, "import androidx.compose.foundation.text.KeyboardOptions")
              s = "\n".join(lines) + "\n"
          # ContentResolver display names are nullable; normalize before lowercase().
          s = s.replace("val lowerName = displayName.lowercase(Locale.ROOT)", "val lowerName = displayName.orEmpty().lowercase(Locale.ROOT)")
          p.write_text(s)
          print("Applied TopAppBar, KeyboardOptions import, and nullable display-name fixes.")
          PY
          echo "---- MainActivity.kt context after compatibility patch ----"
          nl -ba "$file" | sed -n '65,102p;745,760p;900,914p;1140,1152p'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.locate.outputs.project_dir }}"
          if [ -f gradlew ]; then
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK exists
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          project_dir="${{ steps.locate.outputs.project_dir }}"
          apk="$(find "$project_dir" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1 || true)"
          if [ -z "$apk" ]; then
            echo "::error::assembleDebug finished without a debug APK."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" dist/Tawaami-debug.apk
          sha256sum dist/Tawaami-debug.apk | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tawaami-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 14
