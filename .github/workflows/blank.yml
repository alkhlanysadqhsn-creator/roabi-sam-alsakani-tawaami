name: Tawaami Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: Check project files
        run: |
          find . -maxdepth 4 -type f | head -100

      - name: Verify source ZIP
        run: |
          test -f Tawaami_Release_Candidate_SOURCE.zip
          unzip -t Tawaami_Release_Candidate_SOURCE.zip
